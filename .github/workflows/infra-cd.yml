name: Infrastructure CD

on:
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: "Create resource group if needed"
        type: boolean
        default: false

      confirm_destructive:
        description: "Type DEPLOY to confirm infrastructure deployment"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-cd-demo
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-agent-platform-demo
  LOCATION: australiasoutheast
  PARAMETER_FILE: infra/parameters/demo.bicepparam

jobs:
  deploy:
    name: Deploy infrastructure (demo)
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Confirm deployment intent
        env:
          CONFIRMATION: ${{ inputs.confirm_destructive }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "ERROR: Type DEPLOY to confirm."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap resource group
        if: inputs.run_bootstrap
        run: |
          set -euo pipefail

          az deployment sub create \
            --location "$LOCATION" \
            --template-file infra/bootstrap/main.bicep \
            --parameters \
              resourceGroupName="$RESOURCE_GROUP" \
              location="$LOCATION"

      - name: Validate deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail

          bash infra/scripts/validate-deploy-secrets.sh "$PARAMETER_FILE"

      - name: Prepare secure deployment parameters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail

          PARAMS_FILE="$(mktemp)"
          chmod 600 "$PARAMS_FILE"

          python3 - "$PARAMS_FILE" <<'PY'
          import json
          import os
          import sys

          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "databaseUrl": {
                      "value": os.environ.get("DATABASE_URL", "")
                  },
                  "llmApiKey": {
                      "value": os.environ.get("LLM_API_KEY", "")
                  }
              }
          }

          with open(sys.argv[1], "w") as f:
              json.dump(parameters, f)
          PY

          echo "DEPLOY_PARAMS_FILE=$PARAMS_FILE" >> "$GITHUB_ENV"

      - name: Validate Bicep deployment
        run: |
          set -euo pipefail

          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETER_FILE" \
            --parameters @"$DEPLOY_PARAMS_FILE"

      - name: Deploy resource group infrastructure
        run: |
          set -euo pipefail

          DEPLOYMENT_NAME="eap-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> "$GITHUB_ENV"

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETER_FILE" \
            --parameters @"$DEPLOY_PARAMS_FILE"

      - name: Print non-sensitive outputs
        run: |
          set -euo pipefail

          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs \
            -o json

      - name: Remove temporary parameter file
        if: always()
        run: |
          if [ -n "${DEPLOY_PARAMS_FILE:-}" ]; then
            rm -f "$DEPLOY_PARAMS_FILE"
          fi
